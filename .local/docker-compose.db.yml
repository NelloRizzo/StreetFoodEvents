# Solo MongoDB per lo sviluppo locale senza Docker (usato da `npm run setup:local`).
# Avvia un singolo replica-set node necessario per le transazioni di mongoose.
services:
  mongo:
    image: mongo:7
    container_name: streetfood-events-local-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip", "0.0.0.0"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data-dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  mongo-data-dev:
